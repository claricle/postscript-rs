[workspace]
resolver = "2"
members = [
    "crates/postscript-core",
    "crates/postscript-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
repository = "https://github.com/claricle/postscript-rs"

[workspace.dependencies]
# Shared dependencies
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
